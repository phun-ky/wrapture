# This is a basic workflow to help you get started with Actions

name: Checks

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']
    paths:
      - '.github/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - '.npmrc'
  pull_request:
    branches: ['main']
    types: [opened, synchronize] # Workflow triggering events
    # No paths filter here: "check" is a required status, and a workflow skipped by
    # a paths filter never reports it, so a README-only pull request could never merge.
    # The changes job below skips the check job instead, which counts as passed.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Decides whether a pull request touches anything the check job builds or tests
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          # If the files can't be listed, run the check rather than skip it
          elif ! files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only) \
            || grep -qE '^(\.github/|src/|package(-lock)?\.json$|rollup\.config\.js$|tsconfig\.json$|\.npmrc$)' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  # This workflow contains a job called "check"
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Checkout all branches and tags
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.8.0'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install torch onnx onnxsim onnxruntime onnxscript
      - name: Install dependencies
        run: | # Install and link dependencies
          npm i
      - name: Build # Build all packages
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/wrapture
  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: jayqi/failed-build-issue-action@v1.2
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: 💔 build failed'
